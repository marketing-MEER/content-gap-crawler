[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "content-gap-crawler"
version = "1.0.0"
description = "Crawl competitor sitemaps, group their pages into topics and show topics you don't cover"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Meer Hamza", email = "meerhamza5@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["requests>=2.28", "beautifulsoup4>=4.11", "pandas>=1.5", "openpyxl>=3.1", "click>=8.1"]
keywords = ["seo", "content", "gap", "crawler"]

[project.urls]
Homepage = "https://github.com/marketing-MEER/content-gap-crawler"
"SEO Toolbox" = "https://github.com/marketing-MEER/seo-toolbox"
LinkedIn = "https://www.linkedin.com/in/meerhamza-seo"

[project.scripts]
content-gap-crawler = "content_gap_crawler.cli:main"

[tool.setuptools]
packages = ["content_gap_crawler"]
